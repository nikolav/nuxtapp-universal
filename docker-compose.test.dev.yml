services:
  test:
    image: node:20-bookworm-slim

    working_dir: /app

    environment:
      CI: "1"
      NUXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"

    volumes:
      - ./:/app
      - nuxt_node_modules:/app/node_modules
      - nuxt_npm_cache:/root/.npm

    command: >
      bash -lc "
        set -euo pipefail
        if [ ! -f node_modules/.package-lock.json ]; then
          npm ci --prefer-offline --no-progress
        fi
        npm ls --silent >/dev/null
        ./node_modules/.bin/nuxt prepare
        npm run test:run
      "

volumes:
  nuxt_node_modules:
  nuxt_npm_cache:
